server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: qualquer rota desconhecida volta para o index.html (React Router).
  location / {
    try_files $uri /index.html;
  }

  # O nome "api" é resolvido A CADA requisição pelo DNS do Docker. Com
  # "proxy_pass http://api:8080" direto, o nginx resolveria só ao subir — e
  # morreria se a API ainda não existisse (aconteceu depois de um reinício).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
