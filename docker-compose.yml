# nosqlGo — Marketplace + Painel do DBA
#
#   docker compose up -d                    # núcleo: postgres, pgbouncer, mongo, redis, api, web
#   docker compose --profile nosql up -d    # + cassandra e neo4j (+1–2 GB de RAM)
#   docker compose --profile tools up -d    # + pgAdmin e RedisInsight
#   docker compose --profile ha up -d       # + clusters de alta disponibilidade (Fase 5, ~1 GB)
#
# Perfis: https://docs.docker.com/compose/how-tos/profiles/
# Versões verificadas em 2026-11-01 (veja README, seção "Versões").
#
# As portas do núcleo vêm de variáveis (padrão = desenvolvimento) para que o
# stack de E2E (projeto nosqlgo-e2e, e2e/stack.env) suba ao lado deste sem
# conflito. Os testes NUNCA sobem os perfis nosql/tools.

name: nosqlgo

services:
  # ---------------------------------------------------------------- relacional
  postgres:
    # postgres:18.6-alpine + pgBackRest (infra/postgres/Dockerfile). A mesma
    # imagem roda a réplica; o papel vem de PAPEL (infra/postgres/entrypoint.sh).
    build: ./infra/postgres
    image: nosqlgo/postgres:18.6-pgbackrest2.58
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    # init: um processo init (tini) como PID 1 recolhe os processos que o
    # PostgreSQL dispara por fora (archive_command, a instância do PITR).
    init: true
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace   # Fase 6: mover para Docker secrets
      POSTGRES_DB: marketplace
      REPLICADOR_PASSWORD: replicador  # usuário só de replicação (entrypoint.sh)
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial usa /var/lib/postgresql
      # (PGDATA=/var/lib/postgresql/18/docker), facilitando upgrades com pg_upgrade.
      - pgdata:/var/lib/postgresql
      - pgbackrest:/var/lib/pgbackrest
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- réplica (Fase 5)
  # Réplica física por streaming: clona o primário no primeiro boot
  # (pg_basebackup) e aplica o WAL que chega. Só leitura. Os relatórios da
  # loja leem daqui (docs/08, cenários S).
  postgres-replica:
    image: nosqlgo/postgres:18.6-pgbackrest2.58
    build: ./infra/postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf",
              "-c", "cluster_name=replica1", "-c", "shared_buffers=128MB"]
    init: true
    environment:
      PAPEL: replica
      PRIMARIO_HOST: postgres
      REPLICADOR_PASSWORD: replicador
      POSTGRES_PASSWORD: marketplace   # exigido pela imagem; o volume já vem do primário
    ports: ["${POSTGRES_REPLICA_PORT:-5433}:5432"]
    volumes:
      - pgreplica:/var/lib/postgresql
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    shm_size: 128mb
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 60

  # ---------------------------------------------------------------- pooler (Fase 4)
  # PgBouncer em modo TRANSACTION: muitos clientes compartilham poucas conexões
  # com o PostgreSQL. Usado pelo Laboratório de Conexões e por `make pgbench`;
  # a API em si conecta direto, com o próprio pool (pgxpool).
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    # Configuração comentada em infra/pgbouncer/ (a imagem não gera outra quando ela existe).
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["${PGBOUNCER_PORT:-6432}:6432"]
    depends_on:
      postgres: { condition: service_healthy }

  # ---------------------------------------------------------------- documento
  mongo:
    image: mongo:9.0.4
    # Replica set de 1 nó: necessário para transações multi-documento e change streams.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Inicia o replica set na primeira execução; depois só confirma que está ok.
      test: >
        mongosh --quiet --eval "try { rs.status().ok }
        catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------- chave-valor
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes:
      - redisdata:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- wide-column
  cassandra:
    image: cassandra:5.0.9
    profiles: [nosql]
    environment:
      CASSANDRA_CLUSTER_NAME: nosqlgo
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    ports: ["9042:9042"]
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra-init:
    image: cassandra:5.0.9
    profiles: [nosql]
    depends_on:
      cassandra: { condition: service_healthy }
    volumes:
      - ./infra/cassandra/init.cql:/init.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/init.cql"]
    restart: "no"

  # ---------------------------------------------------------------- grafo
  neo4j:
    image: neo4j:2026.10.1-community
    profiles: [nosql]
    environment:
      NEO4J_AUTH: neo4j/marketplace123
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # protocolo Bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p marketplace123 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------- aplicação
  api:
    build: ./backend
    environment:
      POSTGRES_URL: postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable
      # Leituras que toleram atraso (relatórios) e o Laboratório de Replicação.
      POSTGRES_REPLICA_URL: postgres://marketplace:marketplace@postgres-replica:5432/marketplace?sslmode=disable
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_ADDR: redis:6379
      CASSANDRA_HOSTS: cassandra
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_PASSWORD: marketplace123
      RATE_LIMIT_POR_MINUTO: ${RATE_LIMIT_POR_MINUTO:-30}
      # Fase 6: chave do CPF cifrado (pgcrypto). DE DESENVOLVIMENTO — num
      # ambiente de verdade viria de um secret, nunca do repositório.
      CPF_CHAVE: ${CPF_CHAVE:-chave-de-desenvolvimento-nao-use-em-producao}
      PGBOUNCER_URL: postgres://marketplace:marketplace@pgbouncer:6432/marketplace?sslmode=disable
      PGBOUNCER_ADMIN_URL: postgres://marketplace:marketplace@pgbouncer:6432/pgbouncer?sslmode=disable
      # Laboratório de Alta Disponibilidade (perfil ha). Fora do ar = o
      # laboratório diz como subir os clusters (cenário U6).
      HA_POSTGRES_URL: postgres://marketplace:marketplace@haproxy:5000/postgres?sslmode=disable&connect_timeout=2
      HA_PATRONI_URLS: http://patroni1:8008,http://patroni2:8008
      HA_MONGO_URI: mongodb://admin:admin@mongo-ha1:27017,mongo-ha2:27017,mongo-ha3:27017/?replicaSet=rsha&authSource=admin
      HA_REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      # O app mostra o material de estudo (docs/*.md): docs/ entra no build
      # como contexto extra, sem mandar o repositório inteiro para o Docker.
      additional_contexts:
        docs: ./docs
    ports: ["${WEB_PORT:-3000}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- alta disponibilidade (Fase 5, perfil ha)
  # Clusters SÓ DE LABORATÓRIO, ao lado dos bancos da loja (que seguem com um
  # primário e uma réplica): triplicar os bancos do dia a dia não caberia na
  # máquina de estudo. Laboratório de Alta Disponibilidade, docs/09.
  #
  # PostgreSQL: 2 nós com Patroni, consenso no etcd (3 membros), HAProxy na frente.
  etcd1: &etcd
    image: quay.io/coreos/etcd:v3.7.3
    profiles: [ha]
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/tmp/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=nosqlgo-ha
  etcd2:
    <<: *etcd
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/tmp/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=nosqlgo-ha
  etcd3:
    <<: *etcd
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/tmp/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=nosqlgo-ha

  patroni1: &patroni
    build: ./infra/patroni
    image: nosqlgo/patroni:4.1.5-pg18.6
    profiles: [ha]
    environment:
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
    shm_size: 64mb
    depends_on: [etcd1, etcd2, etcd3]
  patroni2:
    <<: *patroni
    environment:
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432

  haproxy:
    image: haproxy:3.4.7-alpine
    profiles: [ha]
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports: ["${HAPROXY_STATS_PORT:-7000}:7000"]
    depends_on: [patroni1, patroni2]

  # MongoDB: replica set de 3 nós (rsha), separado do rs0 da loja.
  # Com autenticação (keyfile): veja infra/mongo-ha/supervisor.sh. O mongo-ha1
  # cria o replica set e o usuário (INICIAR=1).
  mongo-ha1: &mongoha
    image: mongo:9.0.4
    profiles: [ha]
    entrypoint: ["sh", "/ha/supervisor.sh"]
    environment: &mongoha-env
      INICIAR: "1"
      MONGO_HA_CHAVE: chaveDeLaboratorioDoReplicaSetRsha   # só caracteres de base64 · dev (Fase 6: secrets)
      MONGO_HA_USUARIO: admin
      MONGO_HA_SENHA: admin
    volumes:
      - ./infra/mongo-ha:/ha:ro
  mongo-ha2:
    <<: *mongoha
    environment:
      <<: *mongoha-env
      INICIAR: "0"
  mongo-ha3:
    <<: *mongoha
    environment:
      <<: *mongoha-env
      INICIAR: "0"

  # Redis: primário + réplica, vigiados por 3 Sentinels.
  redis-ha1:
    image: redis:8.10.3-alpine
    profiles: [ha]
    # replica-announce-ip: aparece pelo nome (não pelo IP) para os sentinels.
    command: ["redis-server", "/etc/redis-ha/redis.conf", "--replica-announce-ip", "redis-ha1"]
    volumes:
      - ./infra/redis-ha:/etc/redis-ha:ro
  redis-ha2:
    image: redis:8.10.3-alpine
    profiles: [ha]
    command: ["redis-server", "/etc/redis-ha/redis.conf", "--replicaof", "redis-ha1", "6379", "--replica-announce-ip", "redis-ha2"]
    volumes:
      - ./infra/redis-ha:/etc/redis-ha:ro
  sentinel1: &sentinel
    image: redis:8.10.3-alpine
    profiles: [ha]
    # O Sentinel reescreve o próprio arquivo (guarda quem é o primário):
    # precisa de uma cópia gravável.
    command: ["sh", "-c", "cp /etc/redis-ha/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./infra/redis-ha:/etc/redis-ha:ro
    depends_on: [redis-ha1, redis-ha2]
  sentinel2: *sentinel
  sentinel3: *sentinel

  # ---------------------------------------------------------------- ferramentas
  pgadmin:
    image: dpage/pgadmin4:9.19
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nosqlgo.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro

  redisinsight:
    image: redis/redisinsight:3.8.0
    profiles: [tools]
    ports: ["5540:5540"]

volumes:
  pgdata:
  pgreplica:
  pgbackrest:
  mongodata:
  redisdata:
  cassandradata:
  neo4jdata:
