# pgBackRest (Fase 5): backup físico e arquivamento contínuo do WAL.
# Guia: https://pgbackrest.org/user-guide.html
#
# O repositório fica no volume pgbackrest, no MESMO host do banco: serve para
# estudar, mas fere a regra 3-2-1 (docs/08). Em produção, repo1-type=s3/gcs/azure
# ou um repositório num servidor separado.

[global]
repo1-path=/var/lib/pgbackrest
# Guarda os 2 últimos backups full (e os diff/incr que dependem deles); o WAL
# mais velho que o primeiro full guardado é apagado junto.
repo1-retention-full=2
compress-type=zst
# Checkpoint imediato no início do backup, em vez de esperar o próximo.
start-fast=y
process-max=2
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

# stanza = um cluster PostgreSQL com a sua configuração de backup
[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
# O superusuário do projeto (a imagem não cria o papel "postgres").
pg1-user=marketplace
