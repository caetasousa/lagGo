# Redis 8 — configuração de estudo.
# Referência completa: https://raw.githubusercontent.com/redis/redis/unstable/redis.conf
# Atenção: o redis.conf NÃO aceita comentário no fim da linha.

bind 0.0.0.0
# Fase 6: trocar por ACL + senha (docs/10-seguranca-governanca.md)
protected-mode no

# --- Memória ---
maxmemory 256mb
# Ao lotar, descarta as chaves menos usadas (comportamento de cache)
maxmemory-policy allkeys-lru

# --- Persistência (docs/08-replicacao-backup.md) ---
# RDB: fotografia periódica (save <segundos> <alterações> ...)
save 3600 1 300 100 60 10000
# AOF: log de todas as escritas, com fsync a cada segundo
appendonly yes
appendfsync everysec
