# Quem pode conectar e como (Fase 5). Antes, valia o pg_hba.conf gerado pela
# imagem dentro do volume; agora ele vem daqui (hba_file no postgresql.conf),
# para valer também num volume criado antes desta fase.
#
# TIPO   BANCO        USUÁRIO      ENDEREÇO        MÉTODO
# Dentro do container (socket e localhost): o entrypoint, o pgBackRest e os
# health checks. Mesma regra da imagem oficial.
local    all          all                          trust
host     all          all          127.0.0.1/32    trust
host     all          all          ::1/128         trust
local    replication  all                          trust
host     replication  all          127.0.0.1/32    trust

# Replicação física: só o usuário replicador, com senha (SCRAM). "all" na
# coluna BANCO não cobre conexões de replicação — elas precisam desta linha.
host     replication  replicador   all             scram-sha-256

# Todo o resto da rede: senha (SCRAM). Fase 6: TLS (hostssl) e menos amplitude.
host     all          all          all             scram-sha-256
