# Configuração do PostgreSQL 18 para estudo. Valores pensados para um
# container com ~1 GB de RAM. Documentação de cada parâmetro:
# https://www.postgresql.org/docs/18/runtime-config.html
# Calculadora de referência: https://pgtune.leopard.in.ua/

listen_addresses = '*'
max_connections = 100

# --- Memória (docs/06-postgresql-admin.md) ---
shared_buffers = 256MB            # cache de páginas do próprio Postgres (~25% da RAM)
effective_cache_size = 768MB      # estimativa do cache total (Postgres + SO); só influencia o planner
work_mem = 8MB                    # memória por operação de sort/hash — cuidado: multiplica por conexões
maintenance_work_mem = 64MB       # VACUUM, CREATE INDEX

# --- Estatísticas de consultas (Painel do DBA) ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000
track_io_timing = on              # tempo de I/O no EXPLAIN (ANALYZE, BUFFERS)

# --- Log ---
log_min_duration_statement = 200  # loga consultas acima de 200 ms
log_lock_waits = on               # loga esperas de lock > deadlock_timeout
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# --- WAL / replicação (docs/08-replicacao-backup.md) ---
wal_level = replica               # mínimo para streaming replication e PITR
max_wal_senders = 10
max_replication_slots = 10
# Um slot guarda o WAL que a réplica ainda não recebeu. Sem limite, uma réplica
# parada faria o disco do primário encher; acima disto o slot é invalidado.
max_slot_wal_keep_size = 1GB

# Quem pode conectar: arquivo do repositório (vale também para volumes antigos).
hba_file = '/etc/postgresql/pg_hba.conf'

# --- Fase 5: arquivamento contínuo (PITR) com pgBackRest ---
# Cada segmento de WAL completo (16 MB) é copiado para o repositório. Backup
# físico + WAL arquivado = restaurar para QUALQUER instante (PITR).
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
# Com pouca escrita um segmento demora a encher; isto força a troca a cada
# 5 minutos (havendo escrita). É o RPO do PITR se o disco do primário morrer.
archive_timeout = 300

# --- Fase 5: réplica síncrona SOB DEMANDA ---
# A réplica se identifica como replica1 (cluster_name, no compose). Ela é a
# candidata a síncrona, MAS o padrão do servidor é "local": o COMMIT comum
# não espera a réplica (se ela cair, a loja não trava — cenário S6). O
# Laboratório de Replicação pede remote_write / on / remote_apply por
# transação (SET LOCAL) para medir o custo de cada garantia.
synchronous_standby_names = 'replica1'
synchronous_commit = local
# Na réplica: avisa o primário das consultas em andamento, para o VACUUM de
# lá não remover versões que um relatório longo daqui ainda lê (sem isto, a
# consulta é cancelada por "conflict with recovery"). Custo: inchaço no primário.
hot_standby_feedback = on

# --- Autovacuum (docs/06) ---
autovacuum = on

# Fuso e idioma
timezone = 'America/Sao_Paulo'
lc_messages = 'C'                 # mensagens de erro em inglês facilitam a pesquisa
