# Sentinel (Fase 5, perfil ha): https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/
# Três sentinels vigiam o primário. Se ele não responder por 5 s, cada um o
# marca como "subjetivamente fora" (SDOWN); com o quórum de 2 concordando,
# vira "objetivamente fora" (ODOWN) e um deles, eleito, promove a réplica.
port 26379
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor principal redis-ha1 6379 2
sentinel down-after-milliseconds principal 5000
sentinel failover-timeout principal 20000
sentinel parallel-syncs principal 1
