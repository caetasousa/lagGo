; PgBouncer — configuração de estudo (Fase 4, docs/06-postgresql-admin.md §5).
; Referência: https://www.pgbouncer.org/config.html

[databases]
; nome que o cliente pede = onde o PgBouncer conecta de verdade
marketplace = host=postgres port=5432 dbname=marketplace
; banco separado para o pgbench (make pgbench): não suja as tabelas da loja
bench       = host=postgres port=5432 dbname=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction: a conexão real é emprestada ao cliente só durante UMA
; transação. Mil clientes podem dividir 20 conexões. Proibido entre
; transações: SET de sessão, LISTEN, advisory lock de sessão, WITH HOLD cursors.
pool_mode = transaction

; Quantos CLIENTES o PgBouncer aceita (baratos: um socket cada)…
max_client_conn = 1000
; …e quantas conexões REAIS com o PostgreSQL por par (banco, usuário).
default_pool_size = 20

; Prepared statements em modo transaction (PgBouncer 1.21+): o PgBouncer
; reprepara o statement na conexão real que o cliente pegar.
max_prepared_statements = 100

; pgx/psql mandam este parâmetro de startup, que o PgBouncer não repassa.
ignore_startup_parameters = extra_float_digits

; Console de administração: psql -h pgbouncer -p 6432 -U marketplace pgbouncer
admin_users = marketplace
