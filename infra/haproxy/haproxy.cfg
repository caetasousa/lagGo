# HAProxy na frente do cluster Patroni (Fase 5, perfil ha).
# Docs: https://docs.haproxy.org/  ·  padrão do Patroni:
# https://patroni.readthedocs.io/en/latest/rest_api.html#health-check-endpoints
#
# A aplicação nunca sabe quem é o líder: conecta em haproxy:5000 (escrita) ou
# haproxy:5001 (leitura). O HAProxy pergunta a cada nó, pela API REST do
# Patroni na porta 8008, quem ele é: GET /primary responde 200 só no líder.

global
    maxconn 200

defaults
    mode tcp
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    # Verifica cada nó a cada 1 s; 2 falhas = fora; 1 sucesso = dentro.
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions

# Painel do HAProxy: http://localhost:7000 (quando o perfil ha está de pé).
listen estatisticas
    mode http
    bind *:7000
    stats enable
    stats uri /

# Escrita: só o líder passa no /primary.
listen primario
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008

# Leitura: as réplicas.
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
